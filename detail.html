<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="detail.css">
    <title>Document</title>
</head>
<body>
    <header>
    <div class="navbar">

        <nav>
            <a href="https://www.pokemon.com/fr"> <img class="logo_pokemon" src="/images/Logo_pokemon.png"> </a>
            <form action="#" role="search">
                <input type="search" name="q" placeholder="Rechercher…" aria-label="Rechercher">
                <button type="submit" aria-label="Lancer la recherche"></button>
            </form>
            <a href="https://www.youtube.com/@pokemon"> <img class="logo_youtube" src="/images/logo_youtube_transparent.png" alt="pika_youtube"> </a>
        </nav>

    </div>
    </header>
    
    <div class="detail_pokemon">
        <div class="pokemon">

            <img src="/pokemon gif/bulbizarre.gif" width="400" height="auto">


        </div>


        <div class="info_pokemon">

            <h2>Bulbizarre</h2>
            <div class="stats">
                <h3>Aperçu stratégique</h3>
            
                <div class="stat">
                    <span>PV</span>
                    <div class="barre"><b style="--val:45">45</b></div>
                </div>
            
                <div class="stat">
                    <span>Attaque</span>
                    <div class="barre"><b style="--val:49">49</b></div>
                </div>
            
                <div class="stat">
                    <span>Défense</span>
                    <div class="barre"><b style="--val:49">49</b></div>
                </div>
            
                <div class="stat">
                    <span>Attaque spé</span>
                    <div class="barre"><b class="orange" style="--val:65">65</b></div>
                </div>
            
                <div class="stat">
                    <span>Défense spé</span>
                    <div class="barre"><b class="orange" style="--val:65">65</b></div>
                </div>
            
                <div class="stat">
                    <span>Vitesse</span>
                    <div class="barre"><b style="--val:45">45</b></div>
                </div>
            </div>

        </div>
    </div>
</body>
</html>
