<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Filtre + Menu déroulant</title>
<style>
  /* ===== Menu de navigation (dropdown au survol) ===== */
  .nav { list-style: none; display: flex; gap: 20px; padding: 0; margin: 0; background: #333; }
  .nav > li { position: relative; }
  .nav > li > a { display: block; color: #fff; padding: 12px 16px; text-decoration: none; }
  .nav > li > a:hover { background: #555; }

  .submenu {
    display: none;
    position: absolute;
    top: 100%; left: 0;
    background: #444;
    min-width: 160px;
    list-style: none;
    padding: 0; margin: 0;
  }
  .nav > li:hover .submenu { display: block; }
  .submenu li a { display: block; color: #ddd; padding: 10px 16px; text-decoration: none; }
  .submenu li a:hover { background: #666; color: #fff; }

  /* ===== Zone de filtrage ===== */
  .filter-bar { margin: 20px 0; }
  .filter-bar select { padding: 6px 10px; font-size: 1rem; }

  table { border-collapse: collapse; width: 100%; max-width: 500px; }
  th, td { border: 1px solid #ccc; padding: 8px 12px; text-align: left; }
  th { background: #f4f4f4; }
</style>
</head>
<body>

<!-- ===== 1. Menu de navigation avec sous-menu ===== -->
<ul class="nav">
  <li><a href="#">Accueil</a></li>
  <li>
    <a href="#">Catégories ▾</a>
    <ul class="submenu">
      <li><a href="#" data-nav="tech">Technologie</a></li>
      <li><a href="#" data-nav="science">Science</a></li>
      <li><a href="#" data-nav="litt">Littérature</a></li>
    </ul>
  </li>
  <li><a href="#">Contact</a></li>
</ul>

<!-- ===== 2. Menu déroulant (select) pour filtrer ===== -->
<div class="filter-bar">
  <label for="filter">Filtrer :</label>
  <select id="filter">
    <option value="all">Toutes</option>
    <option value="tech">Technologie</option>
    <option value="science">Science</option>
    <option value="litt">Littérature</option>
  </select>
</div>

<!-- ===== Tableau à filtrer ===== -->
<table id="data-table">
  <thead><tr><th>Titre</th><th>Catégorie</th></tr></thead>
  <tbody>
    <tr data-category="tech"><td>Article A</td><td>Technologie</td></tr>
    <tr data-category="science"><td>Article B</td><td>Science</td></tr>
    <tr data-category="litt"><td>Livre C</td><td>Littérature</td></tr>
    <tr data-category="tech"><td>Article D</td><td>Technologie</td></tr>
  </tbody>
</table>

<script>
// --- Filtrage via le <select> ---
const filterSelect = document.getElementById('filter');
const rows = document.querySelectorAll('#data-table tbody tr');

filterSelect.addEventListener('change', function () {
  const val = this.value;
  rows.forEach(row => {
    row.style.display = (val === 'all' || row.dataset.category === val) ? '' : 'none';
  });
});

// --- Le sous-menu de navigation peut aussi déclencher le filtre ---
document.querySelectorAll('[data-nav]').forEach(link => {
  link.addEventListener('click', e => {
    e.preventDefault();
    filterSelect.value = link.dataset.nav;
    filterSelect.dispatchEvent(new Event('change'));
  });
});
</script>

</body>
</html>
