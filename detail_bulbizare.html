<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="detail.css">
    <title>Document</title>
</head>
<body>
    <header>
    <div class="navbar">

        <nav>
            <a href="https://www.pokemon.com/fr"> <img class="logo_pokemon" src="/images/Logo_pokemon.png"> </a>
            <form action="#" role="search">
                <input type="search" name="q" placeholder="Rechercher…" aria-label="Rechercher">
                <button type="submit" aria-label="Lancer la recherche"></button>
            </form>
            <a href="https://www.youtube.com/@pokemon"> <img class="logo_youtube" src="/images/logo_youtube_transparent.png" alt="pika_youtube"> </a>
        </nav>

    </div>
    </header>
    
    <div class="container">

        <div class="detail-header">

            <img src="/pokemon gif/bulbizarre.gif" alt="Bulbizare.png" width="300">

            <div class="detail">
                <h1>#1 Bulbizare</h1>
                <p>Bulbasaur</p>

                <div class="detail-type">
                    <img src="imagestypes/Type_Poison_EV.png" alt="Type_Poison" width="100">
                    <img src="imagestypes/Type_Plante_EV.png" alt="Type_Plante" width="100">
                </div>

                <p>Au début de sa vie, il se nourrit des nutriments accumulés dans la graine sur son dos. Cela lui permet de grandir.</p>
            </div>
        </div>

        <div class="section-evolution">
            
            <h2>Evolution</h2>
            <br>

            <div class="current-evolution">
                <a href="#" class="chaine-evolution">
                    <img src="images/bulbizare.png" alt="Bulbizare" width="80">
                    <span>Bulbizare</span>
                    <span>
                        <img src="imagestypes/Type_Poison_EV.png" alt="Type_Poison" width="50">
                        <img src="imagestypes/Type_Plante_EV.png" alt="Type_Plante" width="50">
                    </span>
                </a>
            </div>
            
            <div class="next-evo">
                <div class="next-symbole">
                    <div class="symbole">
                        <i class="fleche-evo-suivante">➜</i>
                        <span>lvl 16</span>
                    </div>
                </div>
            </div>

        </div>



    </div>

</body>
</html>
