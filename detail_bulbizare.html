<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="detail.css">
    <title>Document</title>
</head>
<body>
    <header>
    <div class="navbar">

        <nav>
            <a href="https://www.pokemon.com/fr"> <img class="logo_pokemon" src="/images/Logo_pokemon.png"> </a>
            <form action="#" role="search">
                <input type="search" name="q" placeholder="Rechercher…" aria-label="Rechercher">
                <button type="submit" aria-label="Lancer la recherche"></button>
            </form>
            <a href="https://www.youtube.com/@pokemon"> <img class="logo_youtube" src="/images/logo_youtube_transparent.png" alt="pika_youtube"> </a>
        </nav>

    </div>
    </header>
    
    <div class="container">

        <div class="detail-header"> <!-- Header Detail -->

            <img src="/pokemon gif/" alt="Bulbizare.png" width="300">

            <div class="detail">
                <h1>#1 Bulbizarre</h1>
                <p>Bulbasaur</p>

                <div class="detail-type">
                    <img src="imagestypes/Type_Poison_EV.png" alt="Type_Poison" width="100">
                    <img src="imagestypes/Type_Plante_EV.png" alt="Type_Plante" width="100">
                </div>

                <p>Au début de sa vie, il se nourrit des nutriments accumulés dans la graine sur son dos. Cela lui permet de grandir.</p>
            </div>
        </div>

        <div class="info-grid">
            <div class="info-section"> <!-- Detail Tab -->
                <h2>ⓘ Information</h2>
                
                <div class="pokemon_info_row">
                    <span class="pokemon_info_text"> Pokedex N° </span>
                    <span class="pokemon_info_text"> #1 </span>
                </div>
            </div>

            <div class="info-section"> <!-- Alternative Forms-->
            </div>

            <div class="info-section" style="grid-column: 1 / -1;"> <!-- Evolution -->
            
            <h2>Evolution</h2>
            <br>
            <div class="list_evo">
                <div class="evo_box">
                    <a href="#" class="chaine-evolution">
                        <img src="images/bulbizare.png" alt="Bulbizare" width="80">
                        <span>Bulbizare</span>
                        <span>
                            <img src="imagestypes/Type_Poison_EV.png" alt="Type_Poison" width="50">
                            <img src="imagestypes/Type_Plante_EV.png" alt="Type_Plante" width="50">
                        </span>
                    </a>
                </div>

                
                <div class="evo_box-suivante">
                    <div class="next-symbole">
                        <div class="symbole">
                            <i class="fleche-evo-suivante">➜</i>
                            <span class="evo-method">lvl 16</span>
                        </div>
                    </div>
                    <div class="next-evo">
                    <a href="#" class="chaine-evolution">
                        <img src="images/Herbizarre-RFVF.png" alt="Herbizarre" width="80">
                        <span>Herbizarre</span>
                        <span>
                            <img src="imagestypes/Type_Poison_EV.png" alt="Type_Poison" width="50">
                            <img src="imagestypes/Type_Plante_EV.png" alt="Type_Plante" width="50">
                        </span>
                    </a>
                    </div>
                </div>


                <div class="evo_box-suivante">
                    <div class="next-symbole">
                        <div class="symbole">
                            <i class="fleche-evo-suivante">➜</i>
                            <span class="evo-method">lvl 32</span>
                        </div>
                    </div>
                    <div class="next-evo">
                        <a href="#" class="chaine-evolution">
                            <img src="images/Florizarre-RFVF.png" alt="Florizarre" width="80">
                            <span>Florizarre</span>
                            <span>
                                <img src="imagestypes/Type_Poison_EV.png" alt="Type_Poison" width="50">
                                <img src="imagestypes/Type_Plante_EV.png" alt="Type_Plante" width="50">
                            </span>
                        </a>
                    </div>
                </div>
            </div>
            </div>
        </div>



    </div>

</body>
</html>
